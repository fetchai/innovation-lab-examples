[project]
name = "shipping-label-agent"
version = "0.1.0"
description = "Pydantic AI shipping-label booking agent for ASI:One (test-mode-only example)"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E402: module-level imports after load_dotenv() are intentional in agent.py.
ignore = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
