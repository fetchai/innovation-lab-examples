[pytest]
markers =
    integration: boots a real uAgents Bureau and needs Twitch/Stripe credentials.

# The integration tests terminate the interpreter with os._exit(0) once the
# agent replies. That kills the pytest process mid-run, so every test that has
# not executed yet is silently dropped and the run still exits 0. Deselect them
# by default and opt in explicitly with:
#
#   pytest -m integration
addopts = -m "not integration"
