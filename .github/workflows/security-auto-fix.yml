name: Security auto-fix

# Cron + Dependabot alert + manual: bump vulnerable pins and open a PR
# tagged for @gautammanak1 review (no AI tokens required).

on:
  schedule:
    # Daily 06:30 UTC
    - cron: "30 6 * * *"
  dependabot_alert:
    types: [created, reopened]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Apply fixes locally but do not open a PR"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: security-auto-fix
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  security-events: read
  issues: write

jobs:
  auto-fix:
    name: Apply Dependabot security bumps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Same token as PR creation so pushes from a PAT trigger pull_request CI.
          token: ${{ secrets.SECURITY_AUTOFIX_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install packaging helper
        run: python -m pip install --upgrade pip packaging

      - name: Fetch open Dependabot alerts
        id: alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/security-auto-fix
          # Paginate all open alerts (GitHub returns max 100 per page).
          # Flatten pages into one JSON array (raw --paginate concatenates arrays).
          gh api --paginate \
            "repos/${GH_REPO}/dependabot/alerts?state=open&per_page=100" \
            --jq '.[]' \
            | jq -s '.' > /tmp/security-auto-fix/alerts.json
          COUNT="$(jq 'length' /tmp/security-auto-fix/alerts.json)"
          echo "open_alerts=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Open Dependabot alerts: ${COUNT}"
          if [ "${COUNT}" = "0" ]; then
            echo "No open alerts; nothing to do."
          fi

      - name: Prepare same-day branch
        id: branch
        if: steps.alerts.outputs.open_alerts != '0'
        run: |
          set -euo pipefail
          BRANCH="security/auto-fix-$(date -u +%Y%m%d)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Checkout the branch BEFORE applying fixes so same-day reruns do not
          # hit "local changes would be overwritten" when switching branches.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            echo "Reusing existing branch ${BRANCH}"
          else
            git checkout -b "$BRANCH"
            echo "Created new branch ${BRANCH}"
          fi

      - name: Apply security version bumps + regenerate locks
        id: fix
        if: steps.alerts.outputs.open_alerts != '0'
        env:
          GITHUB_ALERTS_JSON_FILE: /tmp/security-auto-fix/alerts.json
          SECURITY_FIX_SUMMARY: security-fix-summary.md
        run: |
          set -euo pipefail
          # Script bumps plain pins / package.json, then regenerates
          # uv-compiled requirements + uv.lock via `uv`, and package-lock via `npm`.
          python .github/scripts/security_auto_fix.py
          if [ -s security-fix-changed.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No pin bumps could be applied automatically."
          fi

      - name: Create or update pull request
        id: pr
        if: >-
          steps.fix.outputs.has_changes == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true')
        env:
          # Prefer a PAT/App token so the opened PR actually triggers pull_request
          # workflows (GITHUB_TOKEN pushes do not). Fallback keeps the workflow
          # working without the secret, but CI on the new PR will stay quiet.
          GH_TOKEN: ${{ secrets.SECURITY_AUTOFIX_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVIEWER: gautammanak1
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail

          # Stage only dependency / lock files that the fixer touched.
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            git add -- "$path"
          done < security-fix-changed.txt

          if git diff --cached --quiet; then
            echo "Nothing staged after fixes; aborting PR."
            exit 0
          fi

          git commit -m "$(cat <<'EOF'
          fix(security): auto-bump vulnerable dependency pins

          Opened by the Security auto-fix workflow from Dependabot alerts.
          EOF
          )"

          git push -u origin HEAD

          BODY_FILE="$(mktemp)"
          {
            echo "## Summary"
            echo
            echo "Automated security bumps from open Dependabot alerts."
            echo "Triggered by: \`${{ github.event_name }}\`."
            echo
            cat security-fix-summary.md
            echo
            echo "## Review"
            echo
            echo "cc @${REVIEWER} please review and merge if CI is green."
          } > "$BODY_FILE"

          # jq '.[0].url' prints the literal string "null" for an empty list —
          # treat that as empty so the first daily run actually creates a PR.
          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url \
            -q '.[0].url // empty' || true)"
          if [ -z "${PR_URL}" ] || [ "${PR_URL}" = "null" ]; then
            PR_URL="$(gh pr create \
              --title "fix(security): auto-bump vulnerable dependencies" \
              --body-file "$BODY_FILE" \
              --base main \
              --head "$BRANCH" \
              --label dependencies \
              --label security \
              --reviewer "$REVIEWER" \
              --assignee "$REVIEWER" || true)"
          else
            gh pr comment "$PR_URL" --body-file "$BODY_FILE" || true
          fi

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Opened/found PR: ${PR_URL}"

          if [ -n "${PR_URL}" ] && [ "${PR_URL}" != "null" ]; then
            gh pr comment "$PR_URL" --body "cc @${REVIEWER} — security auto-fix ready for review." || true
            gh pr edit "$PR_URL" --add-reviewer "$REVIEWER" --add-assignee "$REVIEWER" || true
          fi

      - name: Upload summary artifact
        if: always() && steps.alerts.outputs.open_alerts != '0'
        uses: actions/upload-artifact@v7
        with:
          name: security-fix-summary
          path: |
            security-fix-summary.md
            security-fix-changed.txt
          if-no-files-found: ignore
