name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  stargazer-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for maintainer list
        uses: actions/checkout@v4
      - name: Validate PR author has starred this repository
        env:
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          actor = os.environ["ACTOR"]
          actor_lc = actor.lower()
          repo = os.environ["REPO"].lower()
          token = os.environ.get("TOKEN", "")
          owner, name = repo.split("/")

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "stargazer-gate",
          }
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def is_maintainer() -> bool:
              maintainers = set()
              maintainers_file = Path(".github/MAINTAINERS")
              if maintainers_file.exists():
                  for line in maintainers_file.read_text().splitlines():
                      line = line.strip().lstrip("@")
                      if line and not line.startswith("#"):
                          maintainers.add(line.lower())
              if actor_lc in maintainers:
                  return True
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/orgs/fetchai/members/{actor}",
                      headers=headers,
                  )
                  with urllib.request.urlopen(req) as response:
                      if response.status == 204:
                          return True
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{owner}/{name}/collaborators/{actor}/permission",
                      headers=headers,
                  )
                  with urllib.request.urlopen(req) as response:
                      perm = json.loads(response.read().decode("utf-8"))
                      return perm.get("permission") in ("admin", "maintain", "write")
              except urllib.error.HTTPError:
                  return False

          if is_maintainer():
              print(f"Maintainer @{actor}: stargazer gate skipped.")
              sys.exit(0)

          has_starred = False
          for page in range(1, 31):
              url = f"https://api.github.com/users/{actor}/starred?per_page=100&page={page}"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              if not payload:
                  break
              if any(item.get("full_name", "").lower() == repo for item in payload):
                  has_starred = True
                  break

          if has_starred:
              print(f"Check passed: @{actor} has starred {repo}.")
              sys.exit(0)

          print(
              f"Check failed: @{actor} must star {repo} before raising a PR "
              "or their star must be publicly visible."
          )
          sys.exit(1)
          PY

  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require changelog update for community agent changes
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if [ -z "$CHANGED" ]; then
            echo "No files changed."
            exit 0
          fi
          # Only contributors/ carries a changelog. The rest of the repository is
          # a collection of independent examples where a single shared log was
          # more churn than signal, so nothing else is gated here.
          CONTRIB="$(grep -E '^contributors/' <<< "$CHANGED" | grep -vE '\.(md|MD)$' || true)"
          if [ -z "$CONTRIB" ]; then
            echo "No non-doc changes under contributors/; nothing to check."
            exit 0
          fi
          if grep -qx 'contributors/CHANGELOG.md' <<< "$CHANGED"; then
            echo "contributors/CHANGELOG.md updated."
            exit 0
          fi
          echo "Update contributors/CHANGELOG.md for changes under contributors/."
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run lint on changed Python files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED_PY="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.py$' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No Python files changed; skipping lint."
            exit 0
          fi
          echo "$CHANGED_PY" | tr '\n' '\0' | xargs -0 ruff check

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Check formatting on changed Python files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED_PY="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.py$' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No Python files changed; skipping format check."
            exit 0
          fi
          echo "$CHANGED_PY" | tr '\n' '\0' | xargs -0 ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: python -m pip install --upgrade pip mypy
      - name: Run typecheck on changed Python files
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED_PY="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" | grep -E '\.py$' || true)"
          if [ -z "$CHANGED_PY" ]; then
            echo "No Python files changed; skipping typecheck."
            exit 0
          fi
          # One file per invocation: the examples are independent projects that
          # reuse filenames (agent.py, main.py, conftest.py), and checking two
          # same-named files together makes mypy abort with "Duplicate module".
          status=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "::group::mypy $file"
            mypy --ignore-missing-imports --follow-imports=silent "$file" || status=1
            echo "::endgroup::"
          done <<< "$CHANGED_PY"
          exit "$status"

  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository architecture
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED_FILES=("README.md" "CONTRIBUTING.md" "LICENSE" "contributors/README.md")
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required repository file: $file"
              exit 1
            fi
          done
          echo "Architecture validation passed."

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run example test suites
        shell: bash
        run: bash .github/scripts/run-example-tests.sh
