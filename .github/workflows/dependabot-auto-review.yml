name: Dependabot auto-review request

# When Dependabot (or security-auto-fix) opens/updates a dependency PR,
# assign and request review from @gautammanak1.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  schedule:
    # Catch any Dependabot PRs that missed the event (daily).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: dependabot-auto-review-${{ github.event.pull_request.number || 'cron' }}
  cancel-in-progress: true

jobs:
  tag-reviewer:
    name: Tag @gautammanak1
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        (
          github.event.pull_request.user.login == 'dependabot[bot]' ||
          github.event.pull_request.user.login == 'github-actions[bot]' ||
          contains(join(github.event.pull_request.labels.*.name, ','), 'dependencies') ||
          contains(join(github.event.pull_request.labels.*.name, ','), 'security') ||
          startsWith(github.head_ref, 'dependabot/') ||
          startsWith(github.head_ref, 'security/auto-fix')
        )
      )
    steps:
      - name: Request review on this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWER: gautammanak1
        run: |
          set -euo pipefail
          gh pr edit "$PR" --add-reviewer "$REVIEWER" --add-assignee "$REVIEWER" || true
          # Avoid spamming the same comment on every synchronize.
          if gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[].body' | grep -Fq "cc @${REVIEWER} — please review this dependency/security PR"; then
            echo "Review nudge already present."
          else
            gh pr comment "$PR" --body "cc @${REVIEWER} — please review this dependency/security PR."
          fi

      - name: Sweep open Dependabot / security PRs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWER: gautammanak1
        run: |
          set -euo pipefail
          # Open PRs from Dependabot or security auto-fix branches.
          mapfile -t PRS < <(
            gh pr list --state open --limit 100 --json number,author,headRefName,labels \
              --jq '.[] | select(
                .author.login == "dependabot" or
                .author.login == "app/dependabot" or
                (.headRefName | startswith("dependabot/")) or
                (.headRefName | startswith("security/auto-fix")) or
                ([.labels[].name] | index("dependencies") or index("security"))
              ) | .number'
          )
          if [ "${#PRS[@]}" -eq 0 ]; then
            echo "No open dependency/security PRs."
            exit 0
          fi
          for PR in "${PRS[@]}"; do
            echo "Tagging reviewer on PR #${PR}"
            gh pr edit "$PR" --add-reviewer "$REVIEWER" --add-assignee "$REVIEWER" || true
            if gh api "repos/${{ github.repository }}/issues/${PR}/comments" \
              --jq '.[].body' | grep -Fq "cc @${REVIEWER} — please review this dependency/security PR"; then
              continue
            fi
            gh pr comment "$PR" --body "cc @${REVIEWER} — please review this dependency/security PR." || true
          done
